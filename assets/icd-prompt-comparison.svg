<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" role="img" aria-labelledby="title desc">
  <title id="title">ICD prompt development accuracy</title>
  <desc id="desc">Prompt versions one, two, and five achieved one correct case out of five, while versions three and four achieved zero correct cases.</desc>
  <style>
    .title{font:600 18px system-ui,sans-serif;fill:#24292f}.label{font:14px system-ui,sans-serif;fill:#24292f}.tick{font:12px system-ui,sans-serif;fill:#57606a}.grid{stroke:#d0d7de;stroke-width:1}.bar{fill:#0969da}.zero{fill:#8c959f}.value{font:600 14px system-ui,sans-serif;fill:#24292f}
    @media (prefers-color-scheme:dark){.title,.label,.value{fill:#f0f6fc}.tick{fill:#8c959f}.grid{stroke:#30363d}}
  </style>
  <text class="title" x="20" y="30">Development accuracy across prompt versions (n = 5)</text>
  <line class="grid" x1="80" y1="300" x2="780" y2="300"/>
  <line class="grid" x1="80" y1="180" x2="780" y2="180"/><text class="tick" x="68" y="184" text-anchor="end">10%</text>
  <line class="grid" x1="80" y1="60" x2="780" y2="60"/><text class="tick" x="68" y="64" text-anchor="end">20%</text>
  <text class="tick" x="68" y="304" text-anchor="end">0%</text>
  <rect class="bar" x="120" y="60" width="90" height="240" rx="6"/><text class="value" x="165" y="50" text-anchor="middle">20%</text><text class="label" x="165" y="330" text-anchor="middle">V1</text><text class="tick" x="165" y="350" text-anchor="middle">Direct</text>
  <rect class="bar" x="255" y="60" width="90" height="240" rx="6"/><text class="value" x="300" y="50" text-anchor="middle">20%</text><text class="label" x="300" y="330" text-anchor="middle">V2</text><text class="tick" x="300" y="350" text-anchor="middle">ACS rules</text>
  <rect class="zero" x="390" y="292" width="90" height="8" rx="4"/><text class="value" x="435" y="282" text-anchor="middle">0%</text><text class="label" x="435" y="330" text-anchor="middle">V3</text><text class="tick" x="435" y="350" text-anchor="middle">Reasoning</text>
  <rect class="zero" x="525" y="292" width="90" height="8" rx="4"/><text class="value" x="570" y="282" text-anchor="middle">0%</text><text class="label" x="570" y="330" text-anchor="middle">V4</text><text class="tick" x="570" y="350" text-anchor="middle">One-shot</text>
  <rect class="bar" x="660" y="60" width="90" height="240" rx="6"/><text class="value" x="705" y="50" text-anchor="middle">20%</text><text class="label" x="705" y="330" text-anchor="middle">V5</text><text class="tick" x="705" y="350" text-anchor="middle">Strict</text>
</svg>
